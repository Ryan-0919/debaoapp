openapi: 3.0.3
info:
  title: Debao API
  version: 0.2.0
  description: Local productization API for the Debao mobile app.
servers:
  - url: http://127.0.0.1:4000/v1
security:
  - bearerAuth: []
paths:
  /learning-question-media/{file}:
    get:
      security: []
      summary: Stream an uploaded question explanation audio or video file
      parameters:
        - name: file
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9-]+\.(mp3|m4a|wav|ogg|mp4|webm|mov)$'}
        - name: Range
          in: header
          required: false
          schema: {type: string, example: bytes=0-1048575}
      responses:
        '200': {description: Complete media file}
        '206': {description: Requested media byte range}
        '404': {description: Media file not found}
  /admin/learning-question-bank/media:
    post:
      security: [{cookieAuth: []}]
      summary: Upload an optional explanation audio or video file for a learning question
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: {type: string}
        - name: x-file-name
          in: header
          required: true
          schema: {type: string, description: URI-encoded original file name}
      requestBody:
        required: true
        content:
          audio/mpeg: {schema: {type: string, format: binary}}
          audio/mp4: {schema: {type: string, format: binary}}
          audio/wav: {schema: {type: string, format: binary}}
          audio/ogg: {schema: {type: string, format: binary}}
          video/mp4: {schema: {type: string, format: binary}}
          video/webm: {schema: {type: string, format: binary}}
          video/quicktime: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Media file uploaded}
        '413': {description: File exceeds the configured size limit}
        '422': {description: Unsupported or empty media file}
  /learning-card-assets/{file}:
    get:
      security: []
      summary: Read an uploaded image or sandboxed HTML card asset
      parameters:
        - name: file
          in: path
          required: true
          schema: {type: string, pattern: '^[a-f0-9-]+\.(jpg|jpeg|png|webp|gif|html)$'}
      responses:
        '200': {description: Card asset}
        '404': {description: Card asset not found}
  /admin/learning-cards/assets:
    post:
      security: [{cookieAuth: []}]
      summary: Upload one card image or HTML file
      parameters:
        - name: x-csrf-token
          in: header
          required: true
          schema: {type: string}
        - name: x-file-name
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
          image/gif: {schema: {type: string, format: binary}}
          text/html: {schema: {type: string, format: binary}}
      responses:
        '201': {description: Card asset uploaded}
        '413': {description: File too large}
        '422': {description: Unsupported file}
  /admin/learning-cards:
    get:
      security: [{cookieAuth: []}]
      summary: List learning cards
      responses: {'200': {description: Card list and status counts}}
    post:
      security: [{cookieAuth: []}]
      summary: Create a learning card draft
      responses: {'201': {description: Card draft created}, '422': {description: Invalid card or assets}}
  /admin/learning-cards/{id}:
    patch:
      security: [{cookieAuth: []}]
      summary: Edit a card and return it to draft
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Card updated}, '404': {description: Card not found}}
    delete:
      security: [{cookieAuth: []}]
      summary: Delete a card draft
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Draft deleted}, '409': {description: Only drafts can be deleted}}
  /admin/learning-cards/{id}/publish:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Card published}}
  /admin/learning-cards/{id}/disable:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Card disabled}}
  /learning-admin/auth/login:
    post:
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [username, password], properties: {username: {type: string}, password: {type: string}}}}}}
      responses: {'200': {description: Learning admin session created}, '401': {description: Invalid credentials}}
  /learning/diagnostic:
    get:
      security: [{bearerAuth: []}]
      responses: {'200': {description: Learning diagnostic access state and published questions}, '401': {description: Authentication required}}
  /learning/diagnostic/submit:
    post:
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [startedAt, answers], properties: {startedAt: {type: string, format: date-time}, answers: {type: array, items: {type: object, required: [questionId, optionIds], properties: {questionId: {type: string}, optionIds: {type: array, items: {type: string}}}}}}}}}}
      responses: {'201': {description: First diagnostic submitted}, '403': {description: Product access required}, '409': {description: Diagnostic already completed}, '422': {description: Invalid answers}}
  /admin/learning-diagnostic/results:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: keyword, in: query, required: false, schema: {type: string}}]
      responses: {'200': {description: Submitted diagnostic results with profile scores and teacher assignment}, '401': {description: Authentication required}, '403': {description: Permission required}}
  /admin/learning-diagnostic/results/{attemptId}/assignment:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: attemptId, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, properties: {stageId: {type: string, nullable: true}, teacherId: {type: string, nullable: true}}}}}}
      responses: {'200': {description: Diagnostic stage and teacher assignment updated}, '401': {description: Authentication required}, '403': {description: Permission required}, '404': {description: Diagnostic result, stage, teacher or assignment not found}, '422': {description: Stage and teacher do not match}}
  /admin/learning-diagnostic/questions:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: keyword, in: query, required: false, schema: {type: string}}, {name: status, in: query, required: false, schema: {type: string, enum: [draft, published, disabled]}}]
      responses: {'200': {description: Diagnostic question list}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Diagnostic draft created}, '422': {description: Validation error}}
  /admin/learning-diagnostic/form:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Diagnostic form configuration}}
    patch:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Diagnostic form saved as draft}, '422': {description: Validation error}}
  /admin/learning-diagnostic/form/publish:
    post:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Diagnostic form published}}
  /admin/learning-diagnostic/form/disable:
    post:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Diagnostic form disabled}}
  /admin/learning-diagnostic/dimensions:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Configurable diagnostic dimensions}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Diagnostic dimension created}, '422': {description: Validation error}}
  /admin/learning-diagnostic/dimensions/{code}:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Diagnostic dimension updated}}
    delete:
      security: [{cookieAuth: []}]
      parameters: [{name: code, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Diagnostic dimension deleted}, '409': {description: Dimension is in use}}
  /admin/learning-diagnostic/questions/{id}:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Diagnostic question updated as draft}, '404': {description: Not found}}
    delete:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Draft deleted}, '409': {description: Only drafts can be deleted}}
  /admin/learning-diagnostic/questions/{id}/publish:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Diagnostic question published}}
  /admin/learning-diagnostic/questions/{id}/disable:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Diagnostic question disabled}}
  /admin/learning-coach/stages:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Configurable learning stages}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Learning stage created}, '422': {description: Validation error}}
  /admin/learning-coach/class-types:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Configurable learning class types}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Learning class type created}, '422': {description: Validation error}}
  /admin/learning-coach/class-types/{id}:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Learning class type updated}}
    delete:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Learning class type deleted}, '409': {description: Class type is in use}}
  /admin/learning-coach/stages/{id}:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Learning stage updated}}
    delete:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Learning stage deleted}, '409': {description: Learning stage is in use}}
  /admin/learning-coach/stages/{id}/teachers:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Teachers for one isolated learning stage}}
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Teacher created for one learning stage}}
  /admin/learning-coach/stages/{id}/plan:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Stage learning plan rule and content items}}
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Stage learning plan rule updated}, '422': {description: Validation error}}
  /admin/learning-coach/stages/{id}/plan/preview:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Schedule preview for the stage plan}, '422': {description: Validation error}}
  /admin/learning-coach/stages/{id}/plan/publish:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Stage learning plan published}, '409': {description: Stage plan has no content}}
  /admin/learning-coach/stages/{id}/plan/items:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [contentType, title, minutes], properties: {contentType: {type: string, enum: [course, question, card, task], description: "course 表示站外课程，仅保存课程文案，不关联站内视频"}, contentId: {type: string}, title: {type: string}, description: {type: string, description: "站外课程文案或学习内容说明"}, minutes: {type: integer, minimum: 1}, sortOrder: {type: integer}, required: {type: boolean}}}}}}
      responses: {'201': {description: Stage learning plan content item created}, '422': {description: Validation error}}
  /admin/learning-coach/stages/{id}/plan/items/{itemId}:
    patch:
      security: [{cookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: itemId, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Stage learning plan content item updated}, '404': {description: Item not found}}
    delete:
      security: [{cookieAuth: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: itemId, in: path, required: true, schema: {type: string}}
      responses: {'200': {description: Stage learning plan content item deleted}, '404': {description: Item not found}}
  /admin/learning-coach/teachers/{id}:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Teacher updated}}
    delete:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Teacher deleted}, '409': {description: Teacher is in use}}
  /grading/papers:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: subjectId, in: query, required: false, schema: {type: string}}]
      responses: {'200': {description: Published grading paper list}}
  /grading/papers/{id}:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Grading paper with questions}, '404': {description: Paper not found}}
  /grading/submissions:
    get:
      security: [{bearerAuth: []}]
      responses: {'200': {description: Current user's grading records}}
    post:
      security: [{bearerAuth: []}]
      parameters: [{name: Idempotency-Key, in: header, required: true, schema: {type: string}}]
      responses: {'201': {description: Grading submission created}, '422': {description: Validation error}}
  /grading/submissions/{id}/report:
    get:
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Published grading report}, '404': {description: Report not published}}
  /admin/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, minLength: 1, maxLength: 120}
                password: {type: string, minLength: 1}
      responses: {'200': {description: Admin session created}, '401': {description: Invalid admin credentials}, '422': {description: Validation error}}
  /admin/auth/logout:
    post:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Admin session revoked}, '401': {description: Admin authentication required}, '403': {description: Invalid CSRF token}}
  /admin/auth/mfa/verify:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challengeToken, code]
              properties:
                challengeToken: {type: string}
                code: {type: string, pattern: '^\d{6}$'}
      responses: {'200': {description: MFA verified and admin session created}, '401': {description: Invalid or expired MFA challenge}}
  /admin/me/mfa/enroll:
    post:
      security: [{cookieAuth: []}]
      responses: {'200': {description: MFA enrollment secret}, '401': {description: Admin authentication required}}
  /admin/me:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Current administrator}, '401': {description: Admin authentication required}}
  /admin/navigation:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Permission-filtered navigation}, '401': {description: Admin authentication required}}
  /admin/admins:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Administrator list}, '401': {description: Admin authentication required}}
  /admin/admins/{id}/mfa/reset:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason, confirmation], properties: {reason: {type: string, minLength: 4}, confirmation: {type: string, enum: [RESET]}}}}}}
      responses: {'200': {description: MFA reset and sessions revoked}, '403': {description: Forbidden}}
  /admin/roles:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Role and permission catalog}, '401': {description: Admin authentication required}}
  /admin/dashboard:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Dashboard metrics}, '401': {description: Admin authentication required}}
  /admin/users:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Admin user list}, '401': {description: Admin authentication required}}
    post:
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, examYear]
              properties:
                name: {type: string, minLength: 2, maxLength: 80}
                phone: {type: string, pattern: '^1\d{10}$'}
                examYear: {type: string, pattern: '^20\d{2}$'}
      responses: {'201': {description: User created}, '403': {description: Missing users.write permission}, '409': {description: Phone already exists}, '422': {description: Validation error}}
  /admin/users/{id}:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Admin user detail}, '401': {description: Admin authentication required}, '404': {description: User not found}}
    delete:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation]
              properties:
                reason: {type: string, minLength: 4, maxLength: 500}
                confirmation: {type: string, enum: [DELETE]}
      responses: {'200': {description: User removed, sessions revoked and business records retained}, '403': {description: Missing users.write permission}, '404': {description: User not found}, '422': {description: Validation error}}
  /admin/users/{id}/restrictions:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, reason]
              properties:
                type: {type: string, enum: [login, community]}
                reason: {type: string, minLength: 2}
                expiresAt: {type: string, format: date-time}
      responses: {'200': {description: Restriction applied}, '401': {description: Admin authentication required}, '422': {description: Validation error}}
  /admin/users/{id}/sessions/revoke:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Sessions revoked}, '401': {description: Admin authentication required}}
  /admin/users/{id}/entitlements/adjust:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId, type, reason]
              properties:
                courseId: {type: string}
                type: {type: string, enum: [grant, revoke]}
                reason: {type: string, minLength: 2}
                sourceReference: {type: string}
                expiresAt: {type: string, format: date-time}
      responses: {'200': {description: Entitlement adjustment}, '401': {description: Admin authentication required}, '404': {description: Course not found}, '422': {description: Validation error}}
  /admin/content/subjects:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Subject and chapter tree}, '401': {description: Admin authentication required}}
  /admin/questions:
    get:
      security: [{cookieAuth: []}]
      parameters:
        - {name: subjectId, in: query, required: false, schema: {type: string}}
        - {name: chapterId, in: query, required: false, schema: {type: string}}
        - {name: pointId, in: query, required: false, schema: {type: string}}
        - {name: questionType, in: query, required: false, schema: {type: string, enum: [true_false, single, multiple, indeterminate]}}
      responses: {'200': {description: Question list}, '401': {description: Admin authentication required}}
    post:
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stem, options, answer, questionType, analysis, subjectId, chapterId, pointId]
              properties:
                stem: {type: string, minLength: 5, maxLength: 5000}
                options: {type: array, minItems: 2, items: {type: string}}
                answer: {type: integer, minimum: 0}
                answerIndexes: {type: array, minItems: 1, items: {type: integer, minimum: 0}, description: Complete correct-answer set}
                questionType: {type: string, enum: [true_false, single, multiple, indeterminate], default: single}
                analysis: {type: string}
                subjectId: {type: string, description: Subject identifier}
                chapterId: {type: string, description: Objective chapter identifier}
                pointId: {type: string, description: Knowledge-point identifier}
      responses: {'201': {description: Draft question created}, '401': {description: Admin authentication required}, '422': {description: Validation error}}
  /admin/questions/{id}/publish:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Question published}, '401': {description: Admin authentication required}, '404': {description: Question not found}}
  /admin/questions/{id}:
    patch:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stem: {type: string}
                options: {type: array, items: {type: string}}
                answer: {type: integer}
                answerIndexes: {type: array, items: {type: integer, minimum: 0}}
                questionType: {type: string, enum: [true_false, single, multiple, indeterminate]}
                analysis: {type: string}
                subjectId: {type: string, nullable: true, description: Subject identifier; null or empty string clears the subject}
      responses: {'200': {description: Question updated}, '401': {description: Admin authentication required}, '404': {description: Question not found}, '422': {description: Validation error}}
  /admin/questions/{id}/versions:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Immutable question version history}, '401': {description: Admin authentication required}, '404': {description: Question not found}}
  /admin/courses:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Admin course list}, '401': {description: Admin authentication required}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Course draft created}, '401': {description: Admin authentication required}, '422': {description: Validation error}}
  /admin/courses/{id}/publish:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Course published}, '401': {description: Admin authentication required}, '404': {description: Course not found}}
  /admin/courses/{id}/sections:
    get:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Course section and lesson tree}}
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Course section created}}
  /admin/courses/{id}/lessons:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'201': {description: Course lesson created}}
  /admin/courses/live-sessions:
    get:
      security: [{cookieAuth: []}]
      responses: {'200': {description: Live session list}}
    post:
      security: [{cookieAuth: []}]
      responses: {'201': {description: Live session created}}
  /admin/courses/live-sessions/{id}/cancel:
    post:
      security: [{cookieAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Live session cancelled}}
  /admin/grading:
    get:
      security: [{cookieAuth: []}]
