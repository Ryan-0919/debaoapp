      responses: {'200': {description: Service health}, '401': {description: Admin authentication required}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: debao_admin_session
  schemas:
    AdminAnnouncementInput:
      type: object
      required: [title, body, isPinned, audienceType]
      properties:
        title: {type: string, minLength: 2, maxLength: 160}
        body: {type: string, minLength: 2, maxLength: 10000}
        status: {type: string, enum: [draft, published], description: Future startsAt is normalized to scheduled}
        startsAt: {type: string, format: date-time, maximum: '2099-12-31T15:59:59.000Z'}
        endsAt: {type: string, format: date-time, nullable: true, maximum: '2099-12-31T15:59:59.000Z'}
        isPinned: {type: boolean}
        audienceType: {type: string, enum: [all, exam_year]}
        audienceValue: {type: string, pattern: '^20\d{2}$'}
        deepLink: {type: string, nullable: true, description: App path beginning with / or an https H5 URL}
    AdminAnnouncement:
      allOf:
        - {$ref: '#/components/schemas/AdminAnnouncementInput'}
        - type: object
          required: [id, status, persistedStatus, audienceCount, readCount, closedCount, readRate, createdAt]
          properties:
            id: {type: string}
            status: {type: string, enum: [draft, scheduled, published, expired, withdrawn]}
            persistedStatus: {type: string, enum: [draft, scheduled, published, withdrawn]}
            audienceCount: {type: integer, minimum: 0}
            readCount: {type: integer, minimum: 0}
            closedCount: {type: integer, minimum: 0}
            readRate: {type: number, minimum: 0, maximum: 100, description: Read percentage among the estimated audience}
            publishedAt: {type: string, format: date-time}
            withdrawnAt: {type: string, format: date-time}
            withdrawalReason: {type: string}
            updatedAt: {type: string, format: date-time}
            createdAt: {type: string, format: date-time}
    Announcement:
      type: object
      required: [id, title, body, status, isPinned, audienceType, deepLink, read, closed, createdAt]
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        status: {type: string, enum: [published]}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        isPinned: {type: boolean}
        audienceType: {type: string, enum: [all, exam_year]}
        deepLink: {type: string}
        read: {type: boolean}
        closed: {type: boolean}
        publishedAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    ApiEnvelope:
      type: object
      required: [data, requestId]
      properties:
        data: {}
        requestId: {type: string, format: uuid}
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: {type: string, example: ADAPTER_UNAVAILABLE}
            message: {type: string}
            requestId: {type: string, format: uuid}
            details: {type: object, additionalProperties: true}
    UserProfile:
      type: object
      required: [id, name, phone, examYear, studyDays]
      properties:
        id: {type: string}
        name: {type: string}
        phone: {type: string}
        examYear: {type: string, pattern: '^20\\d{2}$'}
        studyDays: {type: integer, minimum: 0}
        avatarColor: {type: string, pattern: '^#[0-9A-Fa-f]{6}$'}
        avatarUrl: {type: string, format: uri}
    UserSettings:
      type: object
      required: [userId, learningReminders, courseUpdates, orderNotifications, updatedAt]
      properties:
        userId: {type: string}
        learningReminders: {type: boolean}
        courseUpdates: {type: boolean}
        orderNotifications: {type: boolean}
        updatedAt: {type: string, format: date-time}
    QuestionRecord:
      type: object
      required: [id, questionId, answers, correct, createdAt, total, correctCount]
      properties:
        id: {type: string}
        questionId: {type: string}
        answers: {type: array, items: {type: string}}
        correct: {type: boolean}
        createdAt: {type: string, format: date-time}
        subjectId: {type: string}
        mode: {type: string, enum: [objective, subjective]}
        title: {type: string}
        analysis: {type: string}
        total: {type: integer, minimum: 0}
        correctCount: {type: integer, minimum: 0}
        questionSnapshot:
          {$ref: '#/components/schemas/QuestionSubmissionSnapshot'}
    QuestionDraft:
      type: object
      required: [questionId, answers]
      properties:
        questionId: {type: string}
        answers: {type: array, items: {type: string}}
        updatedAt: {type: string, format: date-time, nullable: true}
    QuestionDraftEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/QuestionDraft'}
    QuestionDraftSaved:
      allOf:
        - {$ref: '#/components/schemas/QuestionDraft'}
        - type: object
          required: [saved]
          properties:
            saved: {type: boolean}
    QuestionDraftSavedEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - type: object
          properties:
            data: {$ref: '#/components/schemas/QuestionDraftSaved'}
    QuestionRecordPage:
      type: object
      required: [items, page, pageSize, total, answered, correct]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/QuestionRecord'}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, minimum: 0}
        answered: {type: integer, minimum: 0, description: Cumulative answered question count within the applied filters}
        correct: {type: integer, minimum: 0, description: Cumulative correct answer count within the applied filters}
    AppLegalDocument:
      type: object
      required: [key, title, version, status, sections, updatedAt]
      properties:
        key: {type: string, enum: [terms, privacy, sdk-list, account-deletion]}
        title: {type: string}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [published]}
        updatedAt: {type: string, format: date-time}
        sections:
          type: array
          items:
            type: object
            required: [title, body]
            properties:
              title: {type: string}
              body: {type: string}
    VerificationCodeResult:
      type: object
      required: [accepted, expiresIn]
      properties:
        accepted: {type: boolean}
        expiresIn: {type: integer, example: 300}
        developmentCode: {type: string, description: Present only for the explicit local adapter}
    Identity:
      type: object
      required: [provider, boundAt]
      properties:
        provider: {type: string, enum: [wechat]}
        nickname: {type: string}
        boundAt: {type: string, format: date-time}
    Device:
      type: object
      required: [id, platform, name, lastSeenAt, current]
      properties:
        id: {type: string}
        platform: {type: string, enum: [android, ios, harmony]}
        name: {type: string}
        lastSeenAt: {type: string, format: date-time}
        current: {type: boolean}
    DeletionStatus:
      oneOf:
        - type: object
          required: [status]
          properties: {status: {type: string, enum: [none]}}
        - type: object
          required: [status, requestedAt, executeAfter, coolingOffDays]
          properties:
            status: {type: string, enum: [scheduled]}
            requestedAt: {type: string, format: date-time}
            executeAfter: {type: string, format: date-time}
            coolingOffDays: {type: integer, example: 7}
    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, profile]
      properties:
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresIn: {type: integer, example: 604800}
        profile: {$ref: '#/components/schemas/UserProfile'}
    WechatLoginResult:
      oneOf:
        - type: object
          required: [status, session]
          properties:
            status: {type: string, enum: [authenticated]}
            session: {$ref: '#/components/schemas/AuthSession'}
        - type: object
          required: [status, bindingToken, expiresIn]
          properties:
            status: {type: string, enum: [binding_required]}
            bindingToken: {type: string}
            expiresIn: {type: integer, example: 600}
            wechatProfile:
              type: object
              properties:
                nickname: {type: string}
    HomeBanner:
      type: object
      required: [id, title, imageUrl, target]
      properties:
        id: {type: string}
        title: {type: string}
        imageUrl: {type: string}
        target: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    HomeAnnouncement:
      type: object
      required: [id, title, body, status, isPinned, deepLink, read]
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        status: {type: string, enum: [published]}
        isPinned: {type: boolean}
        deepLink: {type: string}
        read: {type: boolean}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    HomeHotPost:
      type: object
      required: [id, title, body, author, createdAt, likeCount]
      properties:
        id: {type: string}
        title: {type: string}
        body: {type: string}
        author: {type: string}
        createdAt: {type: string, format: date-time}
        likeCount: {type: integer, minimum: 0}
    HomeData:
      type: object
      required: [banners, announcements, hotCourses, hotPosts, featuredProduct, exam]
      properties:
        banners:
          type: array
          items: {$ref: '#/components/schemas/HomeBanner'}
        announcements:
          type: array
          items: {$ref: '#/components/schemas/HomeAnnouncement'}
        hotCourses:
          type: array
          items: {$ref: '#/components/schemas/Course'}
        hotPosts:
          type: array
          items: {$ref: '#/components/schemas/HomeHotPost'}
        featuredProduct:
          type: object
          nullable: true
          allOf:
            - {$ref: '#/components/schemas/Product'}
        exam:
          type: object
          required: [year, daysRemaining]
          properties:
            year: {type: string}
            daysRemaining: {type: integer, minimum: 0}
    Course:
      type: object
      required: [id, title, teacher, type, progress, lessons, accent]
      properties:
        id: {type: string}
        title: {type: string}
        teacher: {type: string}
        type: {type: string, enum: [video, audio, live]}
        progress: {type: number, minimum: 0, maximum: 100}
        lessons: {type: integer, minimum: 0}
        accent: {type: string}
        productId: {type: string}
        price: {type: number, minimum: 0}
        originalPrice: {type: number, minimum: 0}
        hasAccess: {type: boolean, description: Personalized access state for the authenticated learner}
        sourceOrderId: {type: string}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [draft, scheduled, published, offline, archived]}
        updatedAt: {type: string, format: date-time}
    CourseEntitlement:
      type: object
      required: [hasAccess]
      properties:
        hasAccess: {type: boolean}
        userId: {type: string}
        courseId: {type: string}
        sourceOrderId: {type: string}
        expiresAt: {type: string, format: date-time}
    LearningPlan:
      type: object
      required: [id, userId, title, dailyMinutes, startDate, endDate, status]
      properties:
        id: {type: string}
        userId: {type: string}
        title: {type: string, minLength: 1, maxLength: 160}
        dailyMinutes: {type: integer, minimum: 1, maximum: 1440}
        startDate: {type: string, format: date}
        endDate: {type: string, format: date}
        status: {type: string, enum: [active, completed, archived]}
    Product:
      type: object
      required: [id, name, category, price, originalPrice, sold, accent, benefits]
      properties:
        id: {type: string}
        name: {type: string}
        category: {type: string}
        price: {type: number, minimum: 0}
        originalPrice: {type: number, minimum: 0}
        sold: {type: integer, minimum: 0}
        accent: {type: string}
        benefits: {type: array, items: {type: string}}
        status: {type: string, enum: [draft, on_sale, off_sale, archived], description: Only on_sale products are exposed to the learner catalog or order creation}
        updatedAt: {type: string, format: date-time}
    Order:
      type: object
      required: [id, productId, productName, amount, status, createdAt]
      properties:
        id: {type: string}
        productId: {type: string}
        productName: {type: string}
        amount: {type: number, minimum: 0}
        status: {type: string, enum: [paid, pending, closed]}
        createdAt: {type: string, format: date-time}
        clientRequestId: {type: string}
    MediaPrepareResult:
      type: object
      required: [available]
      properties:
        available: {type: boolean}
        reason: {type: string}
        url: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    AIReply:
      type: object
      required: [reply]
      properties:
        reply: {type: string}
    ForumCategory:
      type: string
      enum: [经验分享, 答疑求助, 知识整理, 技巧方法]
    ForumPost:
      type: object
      required: [id, authorId, userName, category, title, body, likes, comments, liked, favorited, canDelete, createdAt, updatedAt]
      properties:
        id: {type: string}
        authorId: {type: string}
        userName: {type: string}
        category: {$ref: '#/components/schemas/ForumCategory'}
        title: {type: string, minLength: 4, maxLength: 80}
        body: {type: string, minLength: 10, maxLength: 5000}
        likes: {type: integer, minimum: 0}
        comments: {type: integer, minimum: 0}
        liked: {type: boolean}
        favorited: {type: boolean}
        canDelete: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ForumComment:
      type: object
      required: [id, postId, authorId, userName, body, canDelete, createdAt]
      properties:
        id: {type: string}
        postId: {type: string}
        authorId: {type: string}
        userName: {type: string}
        body: {type: string, minLength: 1, maxLength: 1000}
        canDelete: {type: boolean}
        createdAt: {type: string, format: date-time}
    ForumReport:
      type: object
      required: [id, postId, reason, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        postId: {type: string}
        reason: {type: string, minLength: 2, maxLength: 200}
        status: {type: string, enum: [pending, processing, resolved, rejected]}
        createdAt: {type: string, format: date-time}
    ForumPostEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - {type: object, properties: {data: {$ref: '#/components/schemas/ForumPost'}}}
    ForumCommentEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - {type: object, properties: {data: {$ref: '#/components/schemas/ForumComment'}}}
    ForumReportEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - {type: object, properties: {data: {$ref: '#/components/schemas/ForumReport'}}}
    ForumPostPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/ForumPost'}}
                nextCursor: {type: string}
    ForumCommentPageEnvelope:
      allOf:
        - {$ref: '#/components/schemas/ApiEnvelope'}
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/ForumComment'}}
                nextCursor: {type: string}
    ObjectiveQuestion:
      type: object
      required: [id, stem, options, version]
      properties:
        id: {type: string}
        subjectId: {type: string}
        stem: {type: string}
        options: {type: array, items: {type: string}}
        questionType: {type: string, enum: [true_false, single, multiple, indeterminate]}
        version: {type: integer, minimum: 1}
        source: {type: string}
        answer: {type: integer, minimum: 0, description: Included only in a submitted session snapshot}
        answerIndexes: {type: array, items: {type: integer, minimum: 0}, description: Included only in a submitted session snapshot}
        analysis: {type: string, description: Included only in a submitted session snapshot}
    QuestionSubmissionSnapshot:
      type: object
      description: Immutable question metadata captured when the answer was submitted; historical reports use this snapshot after later question edits.
      required: [id, stem, options, answer, analysis, version]
      properties:
        id: {type: string}
        subjectId: {type: string}
        stem: {type: string}
        options: {type: array, items: {type: string}}
        answer: {type: integer, minimum: 0}
        answerIndexes: {type: array, items: {type: integer, minimum: 0}}
        questionType: {type: string, enum: [true_false, single, multiple, indeterminate]}
        analysis: {type: string}
        version: {type: integer, minimum: 1}
        source: {type: string}
    ObjectiveSessionAnswer:
      type: object
      required: [questionId, answers, updatedAt]
      properties:
        questionId: {type: string}
        answers: {type: array, items: {type: string}}
        updatedAt: {type: string, format: date-time}
    ObjectiveSession:
      type: object
      required: [id, mode, title, questionIds, questions, answers, durationSeconds, startedAt, expiresAt, status]
      properties:
        id: {type: string}
        mode: {type: string, enum: [chapter, year, random, exam]}
        title: {type: string}
        subjectId: {type: string}
        paperId: {type: string}
        questionIds: {type: array, items: {type: string}}
        questions: {type: array, items: {$ref: '#/components/schemas/ObjectiveQuestion'}}
        answers: {type: array, items: {$ref: '#/components/schemas/ObjectiveSessionAnswer'}}
        durationSeconds: {type: integer, minimum: 60}
        startedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        status: {type: string, enum: [in_progress, submitted, expired]}
        reportId: {type: string}
        submittedAt: {type: string, format: date-time}
    ObjectiveReportResult:
      type: object
      required: [questionId, stem, options, version, answers, correctAnswers, correct, analysis]
      properties:
        questionId: {type: string}
        subjectId: {type: string}
        stem: {type: string}
        options: {type: array, items: {type: string}}
        questionType: {type: string, enum: [true_false, single, multiple, indeterminate]}
        version: {type: integer, minimum: 1}
        answers: {type: array, items: {type: string}}
        correctAnswers: {type: array, items: {type: string}}
        correct: {type: boolean}
        analysis: {type: string}
    ObjectiveReport:
      type: object
      required: [id, sessionId, mode, title, total, answered, correct, score, maxScore, results, subjectStats, submittedAt]
      properties:
        id: {type: string}
        sessionId: {type: string}
        mode: {type: string, enum: [chapter, year, random, exam]}
        title: {type: string}
        total: {type: integer, minimum: 0}
        answered: {type: integer, minimum: 0}
        correct: {type: integer, minimum: 0}
        score: {type: number, minimum: 0}
        maxScore: {type: number, minimum: 0}
        results: {type: array, items: {$ref: '#/components/schemas/ObjectiveReportResult'}}
        subjectStats: {type: array, items: {type: object, required: [subjectId, total, correct, correctRate], properties: {subjectId: {type: string}, total: {type: integer}, correct: {type: integer}, correctRate: {type: integer, minimum: 0, maximum: 100}}}}
        submittedAt: {type: string, format: date-time}
    ErrorResponse:
      $ref: '#/components/schemas/ApiError'
  requestBodies:
    CreateLearningPlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title]
            properties:
              title: {type: string, minLength: 1, maxLength: 160}
              dailyMinutes: {type: integer, minimum: 1, maximum: 1440, default: 60}
              startDate: {type: string, format: date}
              endDate: {type: string, format: date}
    UpdateLearningPlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            minProperties: 1
            properties:
              title: {type: string, minLength: 1, maxLength: 160}
              dailyMinutes: {type: integer, minimum: 1, maximum: 1440}
              startDate: {type: string, format: date}
              endDate: {type: string, format: date}
              status: {type: string, enum: [active, completed, archived]}
    UpdateProfile:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: {type: string, maxLength: 80}
              examYear: {type: string, pattern: '^20\d{2}$'}
              avatarColor: {type: string, pattern: '^#[0-9A-Fa-f]{6}$'}
              avatarUrl: {type: string, format: uri, maxLength: 2000}
    SendCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone]
            properties:
              phone:
                type: string
                pattern: '^1\\d{10}$'
              purpose:
                type: string
                enum: [login, bind_phone]
    Login:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone, code]
            properties:
              phone:
                type: string
              code:
                type: string
                minLength: 6
                maxLength: 6
              deviceId:
                type: string
    WechatLogin:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: {type: string}
              deviceId: {type: string}
    OneClickLogin:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [providerToken]
            properties:
              providerToken: {type: string}
              deviceId: {type: string}
              bindingToken: {type: string}
    BindWechatPhone:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [bindingToken, phone, code]
            properties:
              bindingToken: {type: string}
              phone: {type: string, pattern: '^1\\d{10}$'}
              code: {type: string, minLength: 6, maxLength: 6}
              deviceId: {type: string}
    RefreshSession:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties: {refreshToken: {type: string}}
    SmsCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties: {code: {type: string, pattern: '^\d{6}$'}}
    BindCurrentWechat:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, smsCode]
            properties:
              code: {type: string, description: One-time native WeChat authorization code}
              smsCode: {type: string, pattern: '^\d{6}$'}
    PhoneChangeCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [stage]
            properties:
              stage: {type: string, enum: [current, new]}
              phone: {type: string, pattern: '^1\d{10}$', description: Required when stage is new}
    PhoneChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [newPhone, oldCode, newCode]
            properties:
              newPhone: {type: string, pattern: '^1\d{10}$'}
              oldCode: {type: string, pattern: '^\d{6}$'}
              newCode: {type: string, pattern: '^\d{6}$'}
    RegisterDevice:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [deviceId, platform, name]
            properties:
              deviceId: {type: string}
              platform: {type: string, enum: [android, ios, harmony]}
              name: {type: string, maxLength: 120}
              pushToken: {type: string}
    QuestionSubmission:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [questionId, answers]
            properties:
              questionId:
                type: string
              answers:
                type: array
                minItems: 1
                items:
                  type: string
                description: Option indexes encoded as strings; multiple-choice answers may contain more than one index.
    SaveQuestionDraft:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [questionId, answers]
            properties:
              questionId: {type: string, description: Must equal the path parameter}
              answers: {type: array, items: {type: string}}
    CreateOrder:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [productId, clientRequestId]
            properties:
              productId:
                type: string
              clientRequestId:
                type: string
    MediaPrepare:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [courseId, kind]
            properties:
              courseId:
                type: string
              kind:
                type: string
                enum: [video, audio, live]
    AIReply:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [prompt]
            properties:
              prompt: {type: string, minLength: 1, maxLength: 4000}
    CreateForumPost:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [category, title, body]
            properties:
              category: {$ref: '#/components/schemas/ForumCategory'}
              title: {type: string, minLength: 4, maxLength: 80}
              body: {type: string, minLength: 10, maxLength: 5000}
    CreateForumComment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: {type: string, minLength: 1, maxLength: 1000}
    CreateForumReport:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason: {type: string, minLength: 2, maxLength: 200}
    CreateQuestionSession:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              mode: {type: string, enum: [chapter, year, random, exam], default: chapter}
              title: {type: string, maxLength: 200}
              subjectId: {type: string}
              paperId: {type: string}
              questionIds: {type: array, minItems: 1, maxItems: 100, items: {type: string}}
              limit: {type: integer, minimum: 1, maximum: 100}
              durationSeconds: {type: integer, minimum: 60, maximum: 28800}
              idempotencyKey: {type: string, minLength: 8, maxLength: 120}
    SaveQuestionAnswer:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [answers]
            properties:
              questionId: {type: string, description: Required when using the collection endpoint}
              answers: {type: array, items: {type: string}}
    SubmitQuestionSession:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              idempotencyKey: {type: string, minLength: 8, maxLength: 120, description: Header is preferred; body alias is retained for legacy clients}
  responses:
    AdapterUnavailable:
      description: Provider adapter is unavailable or not configured
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
