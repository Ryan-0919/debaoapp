services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: debao
      POSTGRES_USER: debao
      POSTGRES_PASSWORD: debao
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debao -d debao"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - debao-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - debao-redis:/data
  api:
    build: .
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://debao:debao@postgres:5432/debao
      REDIS_URL: redis://redis:6379
      DEBAO_AUTH_SECRET: local-development-only-change-me
      PAYMENT_ADAPTER: local
    ports:
      - "4000:4000"
    command: ["sh", "-c", "npm run migrate && node dist/server.js"]
    depends_on:
      - postgres
      - redis
    restart: on-failure
volumes:
  debao-postgres:
  debao-redis:
