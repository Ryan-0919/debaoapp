services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: debao
      POSTGRES_USER: debao
      POSTGRES_PASSWORD: debao
    ports:
      - "5432:5432"
    volumes:
      - debao-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - debao-redis:/data
  api:
    build: .
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://debao:debao@postgres:5432/debao
      REDIS_URL: redis://redis:6379
      DEBAO_AUTH_SECRET: local-development-only-change-me
      PAYMENT_ADAPTER: local
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
volumes:
  debao-postgres:
  debao-redis:
