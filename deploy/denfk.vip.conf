server {
    listen 80;
    server_name denfk.vip www.denfk.vip;
    root /opt/debao/current/debao-admin/dist;
    index index.html;
    client_max_body_size 512m;
    access_log /var/log/nginx/debao.access.log;
    error_log /var/log/nginx/debao.error.log;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/debao/acme;
    }
    location /v1/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location ~ /\. { deny all; }
}

server {
    listen 443 ssl;
    server_name denfk.vip www.denfk.vip;
    root /opt/debao/current/debao-admin/dist;
    index index.html;
    client_max_body_size 512m;
    ssl_certificate /etc/debao/tls/fullchain.cer;
    ssl_certificate_key /etc/debao/tls/denfk.vip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location /v1/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control "no-store"; }
    location ~ /\. { deny all; }
}
