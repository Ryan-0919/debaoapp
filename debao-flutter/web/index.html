  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="icon" type="image/png" href="favicon.png"/>

<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // The embedded local preview can report a fractional DPR (0.91), while
    // CanvasKit allocates its backing surface at that physical size. Align it
    // to CSS pixels so the preview surface is not tiled by the host renderer.
    (function () {
      var dpr = window.devicePixelRatio;
      var localPreview = window.location.hostname === '127.0.0.1' ||
          window.location.hostname === 'localhost';
      if (localPreview && dpr > 0 && dpr < 1 &&
          Object.defineProperty) {
        try {
          Object.defineProperty(window, 'devicePixelRatio', {
            configurable: true,
            get: function () { return 1; }
          });
        } catch (_) {}
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
